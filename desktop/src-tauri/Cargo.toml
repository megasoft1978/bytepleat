[package]
name = "bytepleat-desktop"
version = "0.1.0"
description = "Bytepleat desktop archive utility"
edition = "2021"
license = "MIT"
rust-version = "1.93"

[lib]
name = "bytepleat_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "bytepleat-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
bytepleat-desktop-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.12.4", features = [] }
tauri-plugin-dialog = "=2.8.2"
tauri-plugin-opener = "=2.7.1"
tauri-plugin-single-instance = "=2.5.3"
tempfile = "3"

[patch.crates-io]
sevenz-rust2 = { path = "../../vendor/sevenz-rust2" }
