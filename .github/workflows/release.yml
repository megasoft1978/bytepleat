name: Release Arqlet
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  native-ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    with:
      release: true
  publish:
    needs: native-ci
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download all native packages and inventories
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Validate release tag and build aggregate checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$RELEASE_TAG" = v0.5.0
          python3 - <<'PY'
          from pathlib import Path
          p=Path('release-assets')
          expected={
            'arqlet-0.5.0-aarch64-apple-darwin.tar.gz',
            'arqlet-0.5.0-x86_64-unknown-linux-gnu.tar.gz',
            'arqlet-0.5.0-x86_64-pc-windows-msvc.zip',
          }
          actual={x.name for x in p.iterdir() if x.suffix in {'.gz','.zip'}}
          if actual != expected: raise SystemExit(f'asset name mismatch: expected {sorted(expected)}, found {sorted(actual)}')
          for asset in sorted(expected):
            sidecar=p/(asset+'.sha256')
            if not sidecar.is_file() or sidecar.read_text().split()!=[__import__('hashlib').sha256((p/asset).read_bytes()).hexdigest(),asset]:
              raise SystemExit(f'asset checksum sidecar invalid: {asset}')
          PY
          cd release-assets
          sha256sum arqlet-0.5.0-aarch64-apple-darwin.tar.gz arqlet-0.5.0-x86_64-unknown-linux-gnu.tar.gz arqlet-0.5.0-x86_64-pc-windows-msvc.zip > SHA256SUMS
          test -f THIRD-PARTY-aarch64-apple-darwin.json
          test -f THIRD-PARTY-x86_64-unknown-linux-gnu.json
          test -f THIRD-PARTY-x86_64-pc-windows-msvc.json
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > release-notes.md <<'EOF'
          Arqlet 0.5.0 is a byte-preserving command-line archiver using established formats. These packages were built and executed on their named native GitHub Actions runners.

          Packages are unsigned; macOS packages are not notarized. SHA256SUMS detects accidental corruption and is not a signature. Target dependency inventories are included per platform; they are informational and are not formal legal certification.
          EOF
          gh release create "$RELEASE_TAG" release-assets/arqlet-0.5.0-aarch64-apple-darwin.tar.gz release-assets/arqlet-0.5.0-aarch64-apple-darwin.tar.gz.sha256 release-assets/arqlet-0.5.0-x86_64-unknown-linux-gnu.tar.gz release-assets/arqlet-0.5.0-x86_64-unknown-linux-gnu.tar.gz.sha256 release-assets/arqlet-0.5.0-x86_64-pc-windows-msvc.zip release-assets/arqlet-0.5.0-x86_64-pc-windows-msvc.zip.sha256 release-assets/THIRD-PARTY-aarch64-apple-darwin.json release-assets/THIRD-PARTY-x86_64-unknown-linux-gnu.json release-assets/THIRD-PARTY-x86_64-pc-windows-msvc.json release-assets/SHA256SUMS --verify-tag --title "Arqlet 0.5.0" --notes-file release-notes.md
