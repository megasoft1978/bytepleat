name: Native CI
on:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
        required: false
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-latest
            target: aarch64-apple-darwin
            exe: bytepleat
          - name: Linux x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            exe: bytepleat
          - name: Windows x86_64 MSVC
            os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: bytepleat.exe
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Guard tracked source export
        run: python scripts/check_source_export.py
      - name: Install native codec and archive tools
        if: runner.os == 'macOS'
        run: brew install zstd lz4 gzip sevenzip
      - name: Install native codec and archive tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd liblz4-tool gzip 7zip
      - name: Install native codec and archive tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/prepare_windows_tools.ps1
      - name: Install stable Rust tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Record runner and toolchain
        run: |
          mkdir -p .ci-results
          {
            rustc --version --verbose
            cargo --version
            python --version
            python -c "import platform; print(platform.platform()); print(platform.machine())"
          } > .ci-results/runner.txt
        shell: bash
      - name: Check formatting
        run: cargo +stable fmt --all -- --check
      - name: Clippy
        run: cargo +stable clippy --locked --all-targets -- -D warnings
      - name: Rust tests
        run: cargo +stable test --locked
      - name: Python packaging safety tests
        run: python -m unittest discover -s scripts/tests -v
      - name: Build release binary
        run: cargo +stable build --locked --release --bin bytepleat
      - name: Verify native binary and generated byte roundtrips
        run: python scripts/native_smoke.py --binary "target/release/${{ matrix.exe }}" --output .ci-results/native-smoke.json --require-tools
      - name: Verify archive interoperability
        run: python scripts/ci_archive_smoke.py --binary "target/release/${{ matrix.exe }}" --output .ci-results/archive-smoke.json
      - name: Verify Windows tar.exe ZIP interoperability
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = Join-Path $PWD 'target/release/bytepleat.exe'
          $work = Join-Path $env:RUNNER_TEMP 'zip-interop'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $src = Join-Path $work 'src'
          New-Item -ItemType Directory -Force -Path (Join-Path $src 'nested/deeper') | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $src 'empty') | Out-Null
          [IO.File]::WriteAllText((Join-Path $src 'top.txt'), "top`n")
          [IO.File]::WriteAllText((Join-Path $src 'nested/deeper/leaf.txt'), "leaf`n")
          function Get-Tree([string]$root) {
            Get-ChildItem -LiteralPath $root -Recurse | ForEach-Object {
              $rel = $_.FullName.Substring($root.Length).TrimStart('\', '/').Replace('\', '/')
              if ($_.PSIsContainer) { "DIR  $rel" }
              else { "{0}  {1}" -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash, $rel }
            } | Sort-Object
          }
          function Assert-SameTree([string]$expected, [string]$actual) {
            $a = @(Get-Tree $expected)
            $b = @(Get-Tree $actual)
            if ($a.Count -eq 0) { throw "source tree is empty" }
            if (Compare-Object $a $b) { throw "tree mismatch: $expected vs $actual" }
          }
          # 1. bytepleat writes ZIP, the runner's bsdtar lists and extracts it.
          $zip = Join-Path $work 'x.zip'
          & $bin pack $src --format zip -o $zip
          if ($LASTEXITCODE -ne 0) { throw "bytepleat pack failed: $LASTEXITCODE" }
          & tar.exe -tf $zip
          if ($LASTEXITCODE -ne 0) { throw "tar.exe listing failed: $LASTEXITCODE" }
          $ext = Join-Path $work 'tar-extract'
          New-Item -ItemType Directory -Path $ext | Out-Null
          & tar.exe -xf $zip -C $ext
          if ($LASTEXITCODE -ne 0) { throw "tar.exe extraction failed: $LASTEXITCODE" }
          Assert-SameTree $src $ext
          # 2. bsdtar writes the './' rooted ZIP shape, bytepleat must unpack it.
          $win = Join-Path $work 'win.zip'
          & tar.exe -a -cf $win -C $src .
          if ($LASTEXITCODE -ne 0) { throw "tar.exe ZIP creation failed: $LASTEXITCODE" }
          $out = Join-Path $work 'bytepleat-unpack'
          & $bin unpack $win -o $out
          if ($LASTEXITCODE -ne 0) { throw "bytepleat unpack of tar.exe ZIP failed: $LASTEXITCODE" }
          Assert-SameTree $src $out
      - name: Collect target dependency notices
        run: python scripts/collect_notices.py --target "${{ matrix.target }}" --output-dir .ci-results/notices
      - name: Package and execute verified native release archive
        if: ${{ inputs.release || github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        run: |
          test "${#GITHUB_SHA}" -eq 40
          python scripts/package_release.py --binary "target/release/${{ matrix.exe }}" --target "${{ matrix.target }}" --version 0.5.2 --revision "${GITHUB_SHA}" --output-dir .ci-results/release --bom .ci-results/notices/THIRD-PARTY.json
          archive=$(find .ci-results/release -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print -quit)
          cp .ci-results/notices/THIRD-PARTY.json ".ci-results/release/THIRD-PARTY-${{ matrix.target }}.json"
          sevenz=$(python -c "import os,shutil,pathlib; p=shutil.which('7zz') or shutil.which('7z'); print(p or next((str(pathlib.Path(os.environ.get(k,''))/'7-Zip'/'7z.exe') for k in ('ProgramFiles','ProgramFiles(x86)') if (pathlib.Path(os.environ.get(k,''))/'7-Zip'/'7z.exe').is_file()),''))")
          test -n "$sevenz"
          python scripts/verify_packages.py --archive "$archive" --target "${{ matrix.target }}" --version 0.5.2 --revision "${GITHUB_SHA}" --native --native7z "$sevenz" --output .ci-results/package-verification.json
        shell: bash
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: report-${{ matrix.target }}
          include-hidden-files: true
          path: .ci-results/
          if-no-files-found: warn
      - name: Upload verified release assets
        if: ${{ inputs.release && success() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.target }}
          include-hidden-files: true
          path: .ci-results/release/
          if-no-files-found: error

  msrv:
    name: Linux Rust 1.93 locked check and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust 1.93
        run: rustup toolchain install 1.93.0 --profile minimal
      - run: cargo +1.93.0 check --locked --all-targets
      - run: cargo +1.93.0 test --locked
