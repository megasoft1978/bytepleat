name: Desktop unsigned test artifacts
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/desktop-artifacts.yml'
      - 'desktop/**'
      - 'src/**'
      - 'tests/**'
      - 'vendor/sevenz-rust2/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'LICENSE'
      - 'THIRD-PARTY.json'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/desktop-artifacts.yml'
      - 'desktop/**'
      - 'src/**'
      - 'tests/**'
      - 'vendor/sevenz-rust2/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'LICENSE'
      - 'THIRD-PARTY.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  executable:
    name: ${{ matrix.target }} unsigned test executable
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            host-os: macOS
            host-arch: arm64
            target: aarch64-apple-darwin
          - runner: ubuntu-24.04
            host-os: Linux
            host-arch: x86_64
            target: x86_64-unknown-linux-gnu
          - runner: windows-latest
            host-os: Windows
            host-arch: x86_64
            target: x86_64-pc-windows-msvc
          - runner: windows-latest
            host-os: Windows
            host-arch: x86_64
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Assert explicit build host architecture
        shell: bash
        env:
          EXPECTED_HOST_OS: ${{ matrix.host-os }}
          EXPECTED_HOST_ARCH: ${{ matrix.host-arch }}
        run: |
          actual_os="$(uname -s)"
          actual_arch="$(uname -m)"
          case "$actual_os" in
            Darwin) actual_os=macOS; [ "$actual_arch" = arm64 ] && actual_arch=arm64 ;;
            Linux) actual_os=Linux; [ "$actual_arch" = x86_64 ] && actual_arch=x86_64 ;;
            MINGW*|MSYS*|CYGWIN*) actual_os=Windows; [ "$actual_arch" = x86_64 ] && actual_arch=x86_64 ;;
          esac
          test "$actual_os" = "$EXPECTED_HOST_OS"
          test "$actual_arch" = "$EXPECTED_HOST_ARCH"
      - name: Linux desktop development libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - name: Install stable Rust and target
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add "$TARGET" --toolchain stable
      - name: Build unsigned test executable
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: cargo +stable build --locked --release --target "$TARGET" --manifest-path desktop/src-tauri/Cargo.toml
      - name: Collect target-matched desktop notices
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: python desktop/scripts/collect-desktop-notices.py --target "$TARGET" --output-dir desktop-notices
      - name: Prepare checksummed test artifact and matching notice inventory
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          HOST_OS: ${{ matrix.host-os }}
          HOST_ARCH: ${{ matrix.host-arch }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          python desktop/scripts/prepare-desktop-artifacts.py \
            --executable "desktop/src-tauri/target/$TARGET/release/bytepleat-desktop${{ runner.os == 'Windows' && '.exe' || '' }}" \
            --notices-dir desktop-notices \
            --target "$TARGET" \
            --host-os "$HOST_OS" \
            --host-arch "$HOST_ARCH" \
            --revision "$SOURCE_REVISION" \
            --output-dir desktop-prepared
          tar -czf "desktop-unsigned-test-$TARGET.tar.gz" -C desktop-prepared .
      - name: Upload unsigned test artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-unsigned-test-${{ matrix.target }}
          path: desktop-unsigned-test-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 7
